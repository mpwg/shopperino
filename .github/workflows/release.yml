name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.0

      - name: Show runtime versions
        run: |
          lsb_release -ds
          node --version
          npm --version

      - name: Run tests
        run: npm test

      - name: Capture coverage summary
        run: npm run test:coverage | tee coverage-summary.txt

      - name: Create release archive
        run: git archive --format=tar.gz --output=shopperino-${{ github.ref_name }}.tar.gz ${{ github.sha }}

      - name: Build Docker image
        env:
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="${IMAGE_NAME,,}"
          docker build \
            --pull \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.version=${GITHUB_REF_NAME}" \
            --tag "${image_name}:${GITHUB_REF_NAME}" \
            --tag "${image_name}:latest" \
            .

      - name: Publish Docker image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAME: ghcr.io/${{ github.repository }}
        run: |
          image_name="${IMAGE_NAME,,}"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "${image_name}:${GITHUB_REF_NAME}"
          docker push "${image_name}:latest"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "coverage-summary.txt" \
            "shopperino-${GITHUB_REF_NAME}.tar.gz" \
            --generate-notes \
            --verify-tag
